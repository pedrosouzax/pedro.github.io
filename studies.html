<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studies — Pedro</title>
  <meta name="description" content="Pedro's learning log — books, videos, courses, and articles on AI, statistics, math, and programming. Filtered by format, field, and status." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Navigation ─────────────────────────── -->
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">Pedro</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="studies.html">Studies</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="hobbies.html">Hobbies</a></li>
        <li><a href="notes.html">Notes</a></li>
      </ul>
    </div>
  </nav>

  <!-- ── Page Content ───────────────────────── -->
  <main class="page-content">
    <div class="container">

      <!-- Page header -->
      <header class="page-header fade-in">
        <h1>Studies</h1>
        <p>My learning catalog — books, videos, courses, and articles. Use the filters to browse by format, field, or status.</p>
      </header>

      <!-- Filters -->
      <div class="filters fade-in" style="animation-delay:.05s">
        <div class="filter-group">
          <span class="filter-label">Format</span>
          <div class="filter-pills">
            <button class="filter-pill" data-group="format" data-value="">All</button>
            <button class="filter-pill" data-group="format" data-value="Book">Book</button>
            <button class="filter-pill" data-group="format" data-value="Video">Video</button>
            <button class="filter-pill" data-group="format" data-value="Course">Course</button>
            <button class="filter-pill" data-group="format" data-value="Article">Article</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Field</span>
          <div class="filter-pills">
            <button class="filter-pill" data-group="field" data-value="">All</button>
            <button class="filter-pill" data-group="field" data-value="AI">AI</button>
            <button class="filter-pill" data-group="field" data-value="Statistics">Statistics</button>
            <button class="filter-pill" data-group="field" data-value="Math">Math</button>
            <button class="filter-pill" data-group="field" data-value="Programming">Programming</button>
            <button class="filter-pill" data-group="field" data-value="Other">Other</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Status</span>
          <div class="filter-pills">
            <button class="filter-pill" data-group="status" data-value="">All</button>
            <button class="filter-pill" data-group="status" data-value="Doing">Doing</button>
            <button class="filter-pill" data-group="status" data-value="To Do">To Do</button>
            <button class="filter-pill" data-group="status" data-value="Done">Done</button>
            <button class="filter-pill" data-group="status" data-value="Paused">Paused</button>
          </div>
        </div>
      </div>

      <!-- Results count + grid -->
      <p class="results-count" id="results-count"></p>
      <div class="card-grid" id="studies-grid">
        <!-- Populated by main.js -->
      </div>

    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
